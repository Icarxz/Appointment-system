<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCIS Sync</title>
    <script>
      // Apply the saved dark mode before the first paint, so the loading screen below never flashes white for dark-mode users.
      try { if (localStorage.getItem('chakra-ui-color-mode') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
    <style>
      /* Loading screen while the app downloads. Inline on purpose: it must appear before any other file has loaded.
         React replaces it as soon as the app starts. It stays invisible for the first 150 ms, so a fast load never flashes it. */
      html, body { margin: 0; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #eef2f7; color: #5b6f8f; font: 14px/1.4 'Segoe UI', system-ui, sans-serif; animation: boot-in .2s ease .15s both; }
      :root[data-theme='dark'] .boot { background: #0b1626; color: #93a7c4; }
      .boot-spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(37, 99, 235, .18); border-top-color: #2563eb; animation: boot-spin .8s linear infinite; }
      :root[data-theme='dark'] .boot-spinner { border-color: rgba(147, 197, 253, .2); border-top-color: #60a5fa; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: boot-pulse 1.6s ease-in-out infinite; border-right-color: #2563eb; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-live="polite"><span class="boot-spinner" aria-hidden="true"></span><span>Loading CCIS Sync…</span></div></div>
    <noscript>CCIS Sync needs JavaScript to run. Please turn it on in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
